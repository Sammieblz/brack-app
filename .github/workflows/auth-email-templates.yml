name: Auth Email Templates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check hosted drift or synchronize the reviewed templates
        required: true
        default: check
        type: choice
        options:
          - check
          - apply

permissions:
  contents: read

concurrency:
  group: production-auth-email-templates
  cancel-in-progress: false

jobs:
  hosted-auth-email-config:
    name: ${{ inputs.mode == 'apply' && 'Apply' || 'Check' }} production Auth email templates
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source-controlled templates
        run: |
          npm run auth:emails:validate
          npm run auth:emails:test

      - name: Require the production Supabase credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::The production environment is missing SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Check hosted template drift
        if: inputs.mode == 'check'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run auth:emails:check

      - name: Synchronize and verify hosted templates
        if: inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm run auth:emails:apply
          npm run auth:emails:check
