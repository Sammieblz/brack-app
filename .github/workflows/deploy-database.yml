name: Deploy Production Database Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migrations.lock.json'
      - 'supabase/config.toml'
      - 'supabase/contracts/**'
      - 'scripts/*migration*.mjs'
      - 'scripts/verify-linked-schema-drift.mjs'
      - 'scripts/verify-production-database-contracts.mjs'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migration release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require the protected main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production database migrations can only deploy from main."
            exit 1
          fi

      - name: Checkout complete migration history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0

      - name: Test migration integrity verifier
        run: npm run db:migrations:test

      - name: Verify committed migration lock
        run: npm run db:migrations:verify

      - name: Reject rewritten or backdated migrations
        shell: bash
        env:
          MIGRATION_BASE_REF: ${{ github.event.before }}
        run: |
          base_ref="${MIGRATION_BASE_REF}"
          if [[ -z "${base_ref}" || "${base_ref}" =~ ^0+$ ]]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          node scripts/verify-migration-integrity.mjs --base-ref "${base_ref}"

      - name: Start a clean local database
        run: supabase db start

      - name: Replay all migrations without seed data
        run: supabase db reset --local --no-seed

      - name: Verify complete local migration history
        run: npm run db:migrations:local:postflight

      - name: Verify local data and non-public schema contracts
        run: npm run db:migrations:local:contracts

      - name: Run database contract tests
        run: supabase test db --local

      - name: Lint the replayed schema
        run: supabase db lint --local --level error --fail-on error

  deploy:
    name: Deploy migrations to production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout approved migration history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0

      - name: Validate protected environment configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::The production environment is missing SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "::error::The production environment is missing SUPABASE_DB_PASSWORD."
            exit 1
          fi
          if [[ -z "${SUPABASE_PROJECT_REF}" ]]; then
            echo "::error::The production environment is missing SUPABASE_PROJECT_REF."
            exit 1
          fi
          committed_project_ref="$(sed -nE 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' supabase/config.toml)"
          if [[ -z "${committed_project_ref}" ]]; then
            echo "::error::supabase/config.toml does not declare a project_id."
            exit 1
          fi
          if [[ "${SUPABASE_PROJECT_REF}" != "${committed_project_ref}" ]]; then
            echo "::error::The protected production project reference does not match supabase/config.toml."
            exit 1
          fi

      - name: Link the approved production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}" --yes

      - name: Verify remote migration history before deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run db:migrations:remote:preflight

      - name: Preview pending production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --skip-vault --dry-run

      - name: Apply pending production migrations
        id: apply_migrations
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --skip-vault --yes

      - name: Capture migration history after a failed push
        if: steps.apply_migrations.outcome == 'failure'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/verify-supabase-migration-history.mjs --target linked --mode postflight

      - name: Capture production contracts after a failed push
        if: steps.apply_migrations.outcome == 'failure'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run db:migrations:remote:contracts

      - name: Capture schema drift after a failed push
        if: steps.apply_migrations.outcome == 'failure'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/verify-linked-schema-drift.mjs

      - name: Fail a partially or unsuccessfully applied release
        if: steps.apply_migrations.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Production migration push failed. Diagnostics above are read-only; no retry or history repair was attempted."
          exit 1

      - name: Verify remote migration history and schema after deployment
        if: steps.apply_migrations.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run db:migrations:remote:postflight
