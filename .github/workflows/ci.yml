name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

env:
  # Cloudflare's documented always-pass test widget. Production deployments
  # must replace this with the existing Brack widget through the build env.
  VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  # Browser smoke tests need a complete client configuration, but do not need
  # a live database. Repository variables can point authenticated E2E at a
  # staging project; otherwise these non-secret loopback values keep CI local.
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'ci-public-anon-key' }}

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Enforce warning-free reading core
        run: npm run lint:core

      - name: Run TypeScript type check
        run: npm run check-types

      - name: Verify optimized static media
        run: npm run media:assets:check

      - name: Validate Auth email templates
        run: npm run auth:emails:validate

      - name: Test Auth email synchronization guardrails
        run: npm run auth:emails:test

      - name: Run unit tests
        run: npm test

      - name: Run Edge Function tests
        run: npm run test:edge

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [quality-checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Verify Auth and PWA build artifacts
        run: npm run web:auth-artifacts:check

      - name: Validate build output
        run: |
          if [ ! -d "apps/client/dist" ]; then
            echo "Error: apps/client/dist directory not found"
            exit 1
          fi
          if [ ! -f "apps/client/dist/index.html" ]; then
            echo "Error: apps/client/dist/index.html not found"
            exit 1
          fi
          if [ ! -f "apps/client/dist/_headers" ]; then
            echo "Error: Cloudflare Pages security headers were not copied"
            exit 1
          fi
          echo "Build validation successful"
          ls -lah apps/client/dist/ | head -20

  validate-android:
    name: Validate Android
    runs-on: ubuntu-latest
    needs: [quality-checks, build-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npm run cap:sync:android

      - name: Validate Android project structure
        run: |
          if [ ! -d "android" ]; then
            echo "Error: android directory not found"
            exit 1
          fi
          if [ ! -f "android/app/build.gradle" ]; then
            echo "Error: android/app/build.gradle not found"
            exit 1
          fi
          echo "Android project structure validated"
          ls -lah android/app/ | head -10

      - name: Validate Gradle setup
        working-directory: android
        run: ./gradlew tasks --all || echo "Gradle validation completed (tasks may vary)"

  validate-ios:
    name: Validate iOS
    runs-on: macos-latest
    needs: [quality-checks, build-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npm run cap:sync:ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/App/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          if [ -f "Podfile" ]; then
            pod install
          else
            echo "Podfile not found, skipping pod install"
          fi

      - name: Validate iOS project structure
        run: |
          if [ ! -d "ios" ]; then
            echo "Error: ios directory not found"
            exit 1
          fi
          if [ ! -d "ios/App" ]; then
            echo "Error: ios/App directory not found"
            exit 1
          fi
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "Error: iOS Xcode project not found"
            exit 1
          fi
          echo "iOS project structure validated"
          ls -lah ios/App/ | head -10

  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [quality-checks, build-web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: win
            arch: x64
            script: desktop:dist:win
          - name: Linux x64
            os: ubuntu-22.04
            target: linux
            arch: x64
            script: desktop:dist:linux
          - name: macOS Apple Silicon
            os: macos-latest
            target: mac
            arch: arm64
            script: desktop:dist:mac:arm64
          - name: macOS Intel
            os: macos-15-intel
            target: mac
            arch: x64
            script: desktop:dist:mac:x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Electron desktop shell
        run: npm run desktop:typecheck

      - name: Build desktop artifact
        run: npm run ${{ matrix.script }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: brack-desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: release/desktop/**/*
          if-no-files-found: error

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app for Playwright
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web smoke tests
        run: npx playwright test --project=chromium
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
